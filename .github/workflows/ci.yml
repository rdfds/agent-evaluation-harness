name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Rebuild fixture
        run: |
          python scripts/build_fixture.py
          python scripts/build_workflow_fixture.py
          git diff --exit-code -- data
      - name: Check benchmark and release gates
        run: python -m agent_eval_harness --check
      - name: Check stateful workflow benchmark
        run: python -m agent_eval_harness.workflow_cli --check
      - name: Verify recorded live benchmark
        run: python -m agent_eval_harness.live_cli --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
